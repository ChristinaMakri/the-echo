[project]
name = "echo-sim"
version = "0.1.0"
description = "The Echo: value evolution in a multi-agent LLM society"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_sim"]
